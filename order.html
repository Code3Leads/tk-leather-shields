<!DOCTYPE html>
<html>
<head>
<title>Custom Order | TK Leather Shields</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
<h2>TK Leather Shields</h2>
<nav>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
</nav>
</header>

<section>

<h1>Customize Your Order</h1>
<p>Fill out the form below and we’ll contact you to finalize your custom piece.</p>

<form action="https://formspree.io/f/xojkyoyd" method="POST" class="card">

<input type="text" name="name" placeholder="Your Name" required><br><br>

<input type="email" name="email" placeholder="Email Address" required><br><br>

<input type="text" name="phone" placeholder="Phone Number"><br><br>

<select name="product">

<!-- Shields -->
<option>PGFD Standard Shield</option>
<option>Boston Style Shield</option>
<option>Standard Style Shield</option>
<option>NY Style Shield</option>

<!-- Straps -->
<option>Custom Embossed Radio Strap</option>
<option>Deluxe Radio Strap</option>
<option>Deluxe Dyed Radio Strap</option>
<option>Anti-Sway Radio Strap</option>

<!-- Pouches -->
<option>Basic Universal Radio Pouch</option>
<option>Deluxe Radio Pouch</option>

<!-- Accessories -->
<option>Custom Firehouse Beanies</option>
<option>Custom Firehouse Hats</option>
<option>Custom Name Plates</option>
<option>Leather Glove Strap</option>
<option>SCBA Mask Covers</option>

<!-- Station Pride -->
<option>Custom Firehouse Coffee Mugs</option>
<option>Custom Engraved Travel Mug</option>

</select><br><br>

<textarea name="details" placeholder="Customization details (text, colors, etc)" rows="5"></textarea><br><br>

<button type="submit" class="button">Submit Order</button>

</form>

</section>

<div id="footer"></div>

<script>
fetch("../components/footer.html")
.then(res => res.text())
.then(data => {
document.getElementById("footer").innerHTML = data;
});
</script>

<script>
const params = new URLSearchParams(window.location.search);
const product = params.get("product");

if(product){
  const dropdown = document.querySelector("select[name='product']");
  dropdown.value = product;
}
</script>

</body>
</html>
