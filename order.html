<!DOCTYPE html>
<html>
<head>
<title>Custom Order | TK Leather Shields</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
<h2>TK Leather Shields</h2>
<nav>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
</nav>
</header>

<section>

<h1>Customize Your Order</h1>
<p>Fill out the form below and we’ll contact you to finalize your custom piece.</p>

<form action="https://formspree.io/f/xojkyoyd" method="POST" class="card">

<input type="text" name="name" placeholder="Your Name" required><br><br>

<input type="email" name="email" placeholder="Email Address" required><br><br>

<input type="text" name="phone" placeholder="Phone Number"><br><br>

<select name="product">

<!-- Shields -->
<option value="PGFD Standard Shield">PGFD Standard Shield</option>
<option value="Boston Style Shield">Boston Style Shield</option>
<option value="Standard Style Shield">Standard Style Shield</option>
<option value="NY Style Shield">NY Style Shield</option>

<!-- Straps -->
<option value="Custom Embossed Radio Strap">Custom Embossed Radio Strap</option>
<option value="Deluxe Radio Strap">Deluxe Radio Strap</option>
<option value="Deluxe Dyed Radio Strap">Deluxe Dyed Radio Strap</option>
<option value="Anti-Sway Radio Strap">Anti-Sway Radio Strap</option>

<!-- Pouches -->
<option value="Basic Universal Radio Pouch">Basic Universal Radio Pouch</option>
<option value="Deluxe Radio Pouch">Deluxe Radio Pouch</option>

<!-- Accessories -->
<option value="Custom Firehouse Beanies">Custom Firehouse Beanies</option>
<option value="Custom Firehouse Hats">Custom Firehouse Hats</option>
<option value="Custom Name Plates">Custom Name Plates</option>
<option value="Leather Glove Strap">Leather Glove Strap</option>
<option value="SCBA Mask Covers">SCBA Mask Covers</option>

<!-- Station Pride -->
<option value="Custom Firehouse Coffee Mugs">Custom Firehouse Coffee Mugs</option>
<option value="Custom Engraved Travel Mug">Custom Engraved Travel Mug</option>

</select>

<br><br>

<textarea name="details" placeholder="Customization details (text, colors, etc)" rows="5"></textarea><br><br>

<button type="submit" class="button">Submit Order</button>

</form>

</section>

<div id="footer"></div>

<script>
fetch("components/footer.html")
.then(res => res.text())
.then(data => {
document.getElementById("footer").innerHTML = data;
});
</script>

<script>
const params = new URLSearchParams(window.location.search);
const product = params.get("product");

if(product){
  const dropdown = document.querySelector("select[name='product']");
  dropdown.value = product;
}
</script>

</body>
</html>
